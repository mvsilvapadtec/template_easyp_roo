schema:
  type: object
  required:
    - appServiceName
    - appServiceImage
  properties:
    appServiceName:
      type: string
      title: App Service Name
      default: roomote
    appServiceImage:
      type: string
      title: App Service Image (roomote-app)
      default: ghcr.io/roocodeinc/roomote-app:main
    licenseKey:
      type: string
      title: License Key (only needed past 10 users, see Settings -> Users -> License)
      default: ""
benefits:
  - title: Delegate real coding work
    description:
      Assign Roomote a bug fix, a feature, or a PR review comment from Slack,
      Microsoft Teams, or the web, and it clones the repo, makes the change,
      and opens or updates a pull request on its own.
  - title: Keeps your code on your infrastructure
    description:
      This template runs the entire stack -- app, database, queue, and
      artifact storage -- on your own server, with task sandboxes executing as
      containers on the same host.
  - title: Free for small teams
    description:
      A Roomote deployment is free for up to 10 registered users; larger teams
      can add a license key from Roomote Cloud without changing the
      deployment.
  - title: Works with your existing model provider
    description:
      Bring your own API key for OpenRouter, Anthropic, OpenAI, and other
      models.dev-compatible providers -- entered once in the setup wizard, not
      hardcoded into the deployment.
features:
  - title: Slack and Microsoft Teams integration
    description:
      Mention Roomote in Slack or Teams to start or resume a task without
      leaving the conversation.
  - title: GitHub App automation
    description:
      Roomote creates its own GitHub App through GitHub's manifest flow,
      clones repositories, opens branches, and manages pull requests.
  - title: Live task previews
    description:
      Open a running task's terminal, logs, and (optionally) a live preview of
      the app it is working on, right from the task page.
  - title: Pluggable sandboxes
    description:
      Defaults to Docker sandboxes on the same host; swap to Modal, E2B,
      Daytona, or Azure Container Apps for hosted task execution without a
      Docker socket.
  - title: Declarative environments
    description:
      Define repositories, services, and commands for a project as YAML and
      let Roomote provision the environment automatically on startup.
  - title: Encrypted backups
    description:
      Roomote's own CLI produces an encrypted, passphrase-protected backup
      bundle covering the database, configuration, and artifacts.
tags:
  - AI
  - Developer Tools
  - Automation
  - Self-hosted
