name: Roomote
description:
  Roomote is a self-hosted platform for running AI coding agents against your
  own repositories, triggered from Slack, Microsoft Teams, or the web. Assign
  it a task and it clones your repo, writes the code, opens or updates a pull
  request, and keeps working through review comments and CI failures until the
  task is done. This template deploys the full single-host production stack
  documented in Roomote's SELF_HOSTING.md guide -- web app, API, task
  controller, BullMQ queue worker, Postgres, Redis, and MinIO artifact storage
  -- with the Docker sandbox provider, so tasks run as sibling containers on
  the same host through a restricted Docker socket proxy. A deployment is free
  for up to 10 users. GitHub App, sign-in provider, and model provider key are
  all configured afterwards from Roomote's own in-app /setup wizard, not at
  deploy time.
instructions:
  Once every service is running, copy the SETUP_TOKEN value from any app
  service's environment variables and open
  https://<web-service-domain>/setup?token=<SETUP_TOKEN> to create the
  founding admin account and connect GitHub.
changeLog:
  - date: 2026-08-08
    description: first release, tracks Roomote's Coolify Docker Compose template
links:
  - label: Website
    url: https://roomote.dev
  - label: Documentation
    url: https://github.com/RooCodeInc/Roomote/blob/main/SELF_HOSTING.md
  - label: Github
